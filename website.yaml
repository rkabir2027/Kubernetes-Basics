apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-website
spec:
  replicas: 3
  selector:
    matchLabels:
      app: hello-website
  template:
    metadata:
      labels:
        app: hello-website
    spec:
      containers:
        - name: nginx
          image: nginx:stable-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: hello-website
spec:
  selector:
    app: hello-website
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP